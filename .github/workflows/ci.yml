name: core and web
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - run: make setup
      - run: make lint typecheck test docs-check
      - name: CLI help (no datasets or checkpoints required)
        run: |
          python scripts/train.py --help
          python scripts/evaluate.py --help
          python scripts/ablate.py --help
          python scripts/enhance.py --help
          python scripts/make_synthetic_data.py --help
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
