[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nta_zerodce"
version = "0.0.1"
description = "Research interfaces for Noise- and Temporal-Aware Zero-DCE"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.26", "opencv-python>=4.8", "scikit-image>=0.22", "pillow>=10", "tqdm>=4.66", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.12.7", "mypy>=1.10,<2", "pre-commit>=3.7", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
mypy_path = "src"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
xfail_strict = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# Third-party tensor internals are opaque at M0; project signatures remain strict.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["nta_zerodce.models.*", "nta_zerodce.data.image_dataset", "nta_zerodce.data.video_pairs"]
disallow_subclassing_any = false
