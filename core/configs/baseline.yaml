# All hyperparameters explicit; all extension flags disabled.
schema_version: 1
flags:
  noise_aware: false
  denoise: false
  edge: false
  chroma: false
  adaptive_exp: false
  temporal: false
  light: false
model:
  channels: 32
  iterations: 8
  noise_channels: 16
  denoise_channels: 16
  sigma_max: 0.2
  residual_scale: 0.1
  curve_scale: 1.0
  gain_window: 5
  gain_min: 1.0
  gain_max: 8.0
  eps: 1e-6
weights:
  spa: 1.0
  exp: 10.0
  col: 5.0
  tv: 200.0
  edge: 20.0
  chroma: 20.0
  highlight: 20.0
  noise: 20.0
  invariance: 10.0
  fidelity: 1.0
  temporal: 10.0
loss:
  spatial_patch: 4
  exposure_patch: 16
  exposure_target: 0.6
  adaptive_low: 0.55
  adaptive_high: 0.85
  adaptive_noise_scale: 0.05
  adaptive_noise_penalty: 0.15
  highlight_threshold: 0.8
  chroma_window: 5
  reliability_low: 0.05
  reliability_high: 0.2
  reliability_noise: 2.0
  edge_smooth_sigma: 0.8
  edge_kernel: 5
  edge_noise_multiplier: 2.0
  eps: 1e-6
noise:
  a_min: 0.0
  a_max: 0.01
  b_min: 0.0
  b_max: 0.02
  probability: 1.0
synthetic:
  rotation_degrees: 3.0
  translation_pixels: 8.0
  scale_min: 0.98
  scale_max: 1.02
  flicker_min: 0.9
  flicker_max: 1.1
flow:
  method: "dis"
  preset: "medium"
  scale: 0.5
  fb_alpha: 0.01
  fb_beta: 0.5
  photometric_threshold: 0.1
  align_corners: true
temporal:
  curve_blend: 0.7
  output_blend: 0.0
  histogram_bins: 32
  scene_cut_threshold: 0.3
  pair_source: "synthetic"
  frame_gap: 1
training:
  lr: 1e-4
  batch_size: 8
  crop_size: 256
  epochs: 100
  optimizer: "Adam"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1e-8
  weight_decay: 1e-4
  grad_clip: 0.1
  seed: 17
  workers: 2
  device: "auto"
  checkpoint_every: 5
  log_every: 10
paths:
  train_images: "data/SICE/part1"
  eval_low: "data/LOL/eval15/low"
  eval_high: "data/LOL/eval15/high"
  unpaired: "data/unpaired"
  video_dir: "data/videos/train"
  run_dir: "runs"
  checkpoint_dir: "checkpoints"
