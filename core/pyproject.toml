[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nta_zerodce"
version = "0.0.1"
description = "Noise- and Temporal-Aware Zero-DCE training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.26", "opencv-python>=4.8", "scikit-image>=0.22", "pillow>=10", "tqdm>=4.66", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.12.7", "mypy>=1.10,<2", "pre-commit>=3.7", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
mypy_path = "src"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
xfail_strict = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# Keep public Tensor/nn/optimizer types, without traversing unused compiler,
# distributed, export and testing subsystems pulled in by torch's public imports.
[[tool.mypy.overrides]]
module = ["torch._dynamo.*", "torch._inductor.*", "torch.distributed.*", "torch.onnx.*", "torch.testing.*", "torch.fx.*", "torch._export.*", "torch.export.*", "torch.jit.*"]
follow_imports = "skip"
