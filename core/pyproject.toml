[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nta_zerodce"
version = "0.1.0"
description = "Noise- and Temporal-Aware Zero-DCE: training, inference and HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "opencv-python>=4.8", "scikit-image>=0.22", "pillow>=10", "tqdm>=4.66", "pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = [
  "pytest>=8",
  "ruff==0.12.7",
  "mypy>=1.10,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]

[tool.mypy]
# numpy 2.5+ ships stubs using Python 3.12 `type` statements, which mypy rejects when it
# targets 3.10, and mypy ignores follow_imports=skip for installed packages. Type-check
# against 3.12; runtime 3.10 compatibility is enforced by ruff target-version and CI on 3.10.
python_version = "3.12"
strict = true
follow_imports = "silent"
mypy_path = "src"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
xfail_strict = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# Third-party tensor internals are opaque; project signatures remain strict.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["nta_zerodce.models.*", "nta_zerodce.data.image_dataset", "nta_zerodce.data.video_pairs"]
disallow_subclassing_any = false
